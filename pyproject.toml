[project]
name = "maldi-deconv-rl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "astropy>=7.2.0",
    "auto-mix-prep>=0.2.0",
    "bioio>=3.3.0",
    "bioio-bioformats>=2.0.0",
    "bioio-imzml>=0.3.2",
    "bioio-ome-zarr>=3.4.0",
    "bioio-tifffile>=1.3.0",
    "bokeh<3.10",
    "dask>=2026.1.2",
    "datashader>=0.18.2",
    "hvplot>=0.12.2",
    "imagecodecs>=2026.1.14",
    "marimo>=0.19.4",
    "matplotlib>=3.10.8",
    "nbconvert>=7.17.1",
    "nbformat>=5.10.4",
    "numpy>=2.3.5",
    "openpyxl>=3.1.5",
    "polars>=1.37.1",
    "pyarrow>=23.0.0",
    "pyimzml>=1.5.5",
    "pyzmq>=27.1.0",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.16.3",
    "simpleitk>=2.5.5",
    "tifffile>=2025.10.16",
    "xarray>=2025.12.0",
    "zarr>=3.2.1",
]


[dependency-groups]
dev = [
    "ruff>=0.14.14",
    "ty>=0.0.69",
]

[tool.marimo.runtime]
output_max_bytes = 30_000_000
pythonpath = ["."]
